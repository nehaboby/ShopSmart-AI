
{% extends "base.html" %}

{% block title %}Login | ShopSmart AI{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-container">

        <div class="auth-header">
            <div class="auth-logo">S</div>
            <span class="eyebrow">WELCOME BACK</span>
            <h1>Login to Your Account</h1>
            <p>Continue your smart shopping journey.</p>
        </div>

        <form method="POST"
              action="{{ url_for('main.login') }}"
              class="auth-form">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    value="{{ request.form.get('email', '') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="primary-button auth-submit">
                Login
            </button>

        </form>

        <div class="auth-footer">
            <p>Don't have an account?
                <a href="{{ url_for('main.register') }}">Create an account</a>
            </p>
        </div>

        <div class="auth-back">
            <a href="{{ url_for('main.index') }}">← Back to Home</a>
        </div>

    </div>

</section>

{% endblock %}
